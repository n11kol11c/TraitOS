name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm xorriso mtools lld \
            grub-pc-bin grub-common \
            grub-efi-amd64-bin grub-efi-ia32-bin

      - name: Build kernel
        run: make all

      - name: Build bootable ISO
        run: make iso

      - name: Filesystem smoke test (no emulator)
        run: make smoke

      - uses: actions/upload-artifact@v4
        with:
          name: traitos.iso
          path: traitos.iso
